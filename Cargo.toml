[workspace]
members = [
    "kernel",
    "libs/posix-abi",
    "libs/libc",
    "userland/init",
    "userland/shell",
    "userland/coreutils",
    "tools/xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Rust POSIX OS Developers"]
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
