name: TCB Boundary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"

concurrency:
  group: tcb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unsafe-boundary:
    name: No unsafe code in de-privileged services
    runs-on: ubuntu-latest
    if: |
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci:full' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full')
    steps:
      - uses: actions/checkout@v4
      - name: Enforce ADR-0001 R1 (kernel/src/services is 100% safe Rust)
        run: |
          set -euo pipefail
          pattern='unsafe[[:space:]]*\{|unsafe[[:space:]]+(fn|impl|extern)'
          if grep -RnE --include='*.rs' "$pattern" kernel/src/services/; then
            echo "::error::unsafe code in kernel/src/services violates ADR-0001 R1."
            echo "::error::Move it behind a safe ostd API — see docs/adr/0001-tcb-boundary.md"
            exit 1
          fi
          echo "TCB boundary intact: no unsafe in kernel/src/services."
      - name: Enforce ADR-0001 R5 (No static mut in kernel/src)
        run: |
          set -euo pipefail
          # Check for forbidden static mut globals across kernel/src/ (excluding 'static lifetime)
          if grep -RnE --include='*.rs' "(^|[^'])static[[:space:]]+mut\b" kernel/src/; then
            echo "::error::static mut in kernel/src violates ADR-0001 and TCB soundness."
            echo "::error::Use SyncUnsafeCell, Atomic, or SpinLock instead."
            exit 1
          fi
          echo "Soundness intact: 0 static mut globals in kernel/src."
      - name: Enforce ADR-0001 R5 (// SAFETY comment on every unsafe block)
        run: |
          set -euo pipefail
          # Find all unsafe blocks and verify a // SAFETY: comment appears within
          # the 5 preceding non-blank lines. This handles multi-line SAFETY comments,
          # #[cfg] attributes, and rustfmt continuation lines (e.g. let x =\n    unsafe {).
          violations=0
          while IFS=: read -r file line content; do
            found=false
            check_line=$((line - 1))
            max_scan=$((line - 6))
            [ "$max_scan" -lt 0 ] && max_scan=0
            while [ "$check_line" -ge 1 ] && [ "$check_line" -gt "$max_scan" ]; do
              prev_content=$(sed -n "${check_line}p" "$file")
              if echo "$prev_content" | grep -qE '^\s*$'; then
                break
              fi
              if echo "$prev_content" | grep -q '// SAFETY:'; then
                found=true
                break
              fi
              check_line=$((check_line - 1))
            done
            if [ "$found" = false ]; then
              echo "::error file=${file},line=${line}::Missing // SAFETY: comment before: ${content}"
              violations=$((violations + 1))
            fi
          done < <(grep -RnE --include='*.rs' '^\s*unsafe\s*\{' kernel/src/ostd/ libs/libc/src/ userland/)
          if [ "$violations" -gt 0 ]; then
            echo "::error::${violations} unsafe block(s) missing mandatory // SAFETY: rationale."
            exit 1
          fi
          echo "Safety audit passed: all unsafe blocks have // SAFETY: comments."
      - name: Enforce #![deny(unsafe_op_in_unsafe_fn)] in all crate roots
        run: |
          set -euo pipefail
          missing=0
          for root in kernel/src/main.rs libs/libc/src/lib.rs userland/init/src/main.rs userland/coreutils/src/main.rs userland/shell/src/main.rs; do
            if ! grep -q 'deny(unsafe_op_in_unsafe_fn)' "$root"; then
              echo "::error file=${root}::Missing #![deny(unsafe_op_in_unsafe_fn)] in crate root."
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::${missing} crate root(s) missing #![deny(unsafe_op_in_unsafe_fn)]."
            exit 1
          fi
          echo "All crate roots enforce #![deny(unsafe_op_in_unsafe_fn)]."
      - name: Enforce ADR-0002 L3 (No Process lock in VFS)
        run: |
          set -euo pipefail
          if grep -RnE --include='*.rs' 'get_current_process|PROCESS_TABLE|services::process' kernel/src/services/vfs/; then
            echo "::error::VFS calling into Process/PROCESS_TABLE violates ADR-0002 L3."
            echo "::error::Pass cwd and creds (VfsCreds) as arguments instead."
            exit 1
          fi
          echo "VFS isolation intact: 0 Process lock acquisitions in kernel/src/services/vfs/."
