name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-quality:
    name: rustfmt + clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt (changed .rs only)
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          files=$(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD" | grep '\.rs$' || true)
          if [ -z "$files" ]; then
            echo "No Rust files changed; skip rustfmt."
            exit 0
          fi
          echo "$files" | xargs rustfmt --edition 2024 --check
      - name: clippy host crates
        run: cargo clippy -p posix-abi -p xtask --all-targets -- -D warnings
      - name: clippy kernel
        run: |
          cargo clippy -p kernel \
            --target x86_64-rust-posix-os.json \
            -Zbuild-std=core,alloc \
            -- -D warnings
