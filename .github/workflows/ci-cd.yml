name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'ci/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C relocation-model=static -C code-model=kernel"

jobs:
  check-and-lint:
    name: Codebase Check & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview, clippy

      - name: Check Workspace Crates (x86_64-unknown-none)
        run: |
          cargo check --workspace --exclude xtask --target x86_64-unknown-none \
            -Zbuild-std=core,compiler_builtins,alloc \
            -Zbuild-std-features=compiler-builtins-mem

      - name: Check Cargo Xtask Automation
        run: cargo check --manifest-path tools/xtask/Cargo.toml

  test-suite:
    name: Automated Verification Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Run 13 Verification Test Suites via Xtask
        run: cargo run --manifest-path tools/xtask/Cargo.toml -- test

  build-and-package:
    name: Build & Package UEFI Boot Artifacts
    runs-on: ubuntu-latest
    needs: [check-and-lint, test-suite]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Build Kernel & Stage UEFI Image
        run: cargo run --manifest-path tools/xtask/Cargo.toml -- build

      - name: Create Zip Archive of Boot Drive
        run: |
          cd target
          zip -r ../rust-posix-os-uefi-boot.zip iso_root
          cd ..

      - name: Upload Kernel Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-elf
          path: target/x86_64-unknown-none/debug/kernel
          if-no-files-found: error

      - name: Upload Initramfs Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-tar
          path: target/x86_64-unknown-none/debug/initramfs.tar
          if-no-files-found: error

      - name: Upload UEFI Bootable Drive Package
        uses: actions/upload-artifact@v4
        with:
          name: rust-posix-os-uefi-boot
          path: rust-posix-os-uefi-boot.zip
          if-no-files-found: error

  qemu-smoke-test:
    name: Headless QEMU Boot Smoke Test
    runs-on: ubuntu-latest
    needs: [build-and-package]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install QEMU & OVMF UEFI Firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Download UEFI Bootable Package
        uses: actions/download-artifact@v4
        with:
          name: rust-posix-os-uefi-boot
          path: .

      - name: Unpack UEFI Boot Drive
        run: |
          unzip -q rust-posix-os-uefi-boot.zip -d target

      - name: Boot OS in Headless QEMU & Verify Serial Telemetry
        run: |
          OVMF_PATH="/usr/share/OVMF/OVMF_CODE.fd"
          if [ ! -f "$OVMF_PATH" ]; then
            OVMF_PATH="/usr/share/ovmf/OVMF.fd"
          fi

          echo "[CI] Launching QEMU headless with 12s timeout..."
          timeout --preserve-status 12s qemu-system-x86_64 \
            -drive "if=pflash,format=raw,readonly=on,file=$OVMF_PATH" \
            -drive "file=fat:rw:target/iso_root,format=raw,media=disk" \
            -m 512M \
            -smp 2 \
            -serial file:serial.log \
            -display none \
            -no-reboot || true

          echo "=================== QEMU SERIAL OUTPUT ==================="
          cat serial.log
          echo "=========================================================="

          # Verify critical kernel and userspace milestones in serial telemetry
          grep -q "Rust POSIX Operating System (Framekernel Model)" serial.log || (echo "FAILED: Kernel banner missing" && exit 1)
          grep -q "Kernel Initialization Complete. Kernel running!" serial.log || (echo "FAILED: Kernel init failed" && exit 1)
          grep -q "Rust POSIX OS - Init Daemon (PID 1) Running" serial.log || (echo "FAILED: PID 1 init daemon missing" && exit 1)
          grep -q "Rust POSIX Shell" serial.log || (echo "FAILED: Shell banner missing" && exit 1)
          echo "[CI] QEMU boot smoke test passed successfully!"

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-package, qemu-smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/rust-posix-os-uefi-boot/rust-posix-os-uefi-boot.zip
            release_assets/kernel-elf/kernel
            release_assets/initramfs-tar/initramfs.tar
          generate_release_notes: true
          draft: false
          prerelease: false
