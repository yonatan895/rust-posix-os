name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
      - "ci/**"
      - "cleanup/**"
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: posix-os

      - name: Cache Limine BOOTX64.EFI
        uses: actions/cache@v4
        with:
          path: BOOTX64.EFI
          key: limine-bootx64-v8

      - name: Build kernel and UEFI image
        run: cargo xtask build

      - name: Stage boot artifacts
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist/iso_root
          cp -a target/iso_root/. dist/iso_root/
          cp target/x86_64-unknown-none/debug/kernel dist/kernel
          cp target/x86_64-unknown-none/debug/initramfs.tar dist/initramfs.tar

      - name: Upload UEFI boot artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: uefi-boot
          path: dist/
          if-no-files-found: error
          retention-days: 7

  qemu:
    name: QEMU smoke test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: Download UEFI boot artifacts
        uses: actions/download-artifact@v4
        with:
          name: uefi-boot
          path: dist

      - name: Boot headless QEMU and verify serial
        run: |
          set -euo pipefail
          mkdir -p target
          cp -a dist/iso_root target/iso_root

          OVMF_PATH=""
          for candidate in \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/ovmf/OVMF.fd \
            /usr/share/qemu/OVMF.fd; do
            if [ -f "$candidate" ]; then
              OVMF_PATH="$candidate"
              break
            fi
          done
          if [ -z "$OVMF_PATH" ]; then
            echo "FAILED: OVMF firmware not found"
            exit 1
          fi
          echo "[CI] Using OVMF: $OVMF_PATH"

          set +e
          timeout --signal=TERM --kill-after=5s 45s qemu-system-x86_64 \
            -cpu qemu64 \
            -drive "if=pflash,format=raw,readonly=on,file=$OVMF_PATH" \
            -drive "file=fat:rw:target/iso_root,format=raw,media=disk" \
            -m 512M \
            -smp 2 \
            -serial file:serial.log \
            -display none \
            -no-reboot \
            -no-shutdown
          qemu_rc=$?
          set -e

          echo "=================== QEMU SERIAL OUTPUT ==================="
          if [ -f serial.log ]; then
            cat serial.log
          else
            echo "(serial.log missing, qemu exit $qemu_rc)"
          fi
          echo "=========================================================="

          if [ ! -s serial.log ]; then
            echo "FAILED: empty serial log (qemu exit $qemu_rc)"
            exit 1
          fi

          fail=0
          grep -q "Rust POSIX Operating System (Framekernel Model)" serial.log || { echo "FAILED: kernel banner missing"; fail=1; }
          grep -q "Kernel Initialization Complete. Kernel running!" serial.log || { echo "FAILED: kernel init failed"; fail=1; }
          grep -q "Rust POSIX OS - Init Daemon (PID 1) Running" serial.log || { echo "FAILED: PID 1 init daemon missing"; fail=1; }
          grep -q "Rust POSIX Shell" serial.log || { echo "FAILED: shell banner missing"; fail=1; }
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "[CI] QEMU boot smoke test passed (qemu exit $qemu_rc)"

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: serial.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, qemu]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download UEFI boot artifacts
        uses: actions/download-artifact@v4
        with:
          name: uefi-boot
          path: release_assets

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/kernel
            release_assets/initramfs.tar
          generate_release_notes: true
          draft: false
          prerelease: false
