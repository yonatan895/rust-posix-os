name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
      - "ci/**"
      - "cleanup/**"
      - "fix/**"
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: posix-os

      - name: Cache Limine BOOTX64.EFI
        uses: actions/cache@v4
        with:
          path: BOOTX64.EFI
          key: limine-bootx64-v8

      - name: Build kernel and UEFI image
        run: cargo xtask build

      - name: Stage boot artifacts
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist/iso_root
          cp -a target/iso_root/. dist/iso_root/
          cp target/x86_64-unknown-none/debug/kernel dist/kernel
          cp target/x86_64-unknown-none/debug/initramfs.tar dist/initramfs.tar

      - name: Upload UEFI boot artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: uefi-boot
          path: dist/
          if-no-files-found: error
          retention-days: 7

  qemu:
    name: QEMU smoke test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: Download UEFI boot artifacts
        uses: actions/download-artifact@v4
        with:
          name: uefi-boot
          path: dist

      - name: Boot until shell then stop QEMU
        run: |
          set -euo pipefail
          mkdir -p target
          cp -a dist/iso_root target/iso_root

          OVMF_PATH=""
          for candidate in \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/ovmf/OVMF.fd \
            /usr/share/qemu/OVMF.fd; do
            if [ -f "$candidate" ]; then
              OVMF_PATH="$candidate"
              break
            fi
          done
          if [ -z "$OVMF_PATH" ]; then
            echo "FAILED: OVMF firmware not found"
            exit 1
          fi
          echo "[CI] Using OVMF: $OVMF_PATH"

          : > serial.log
          qemu-system-x86_64 \
            -cpu qemu64 \
            -drive "if=pflash,format=raw,readonly=on,file=$OVMF_PATH" \
            -drive "file=fat:rw:target/iso_root,format=raw,media=disk" \
            -m 512M \
            -smp 2 \
            -serial file:serial.log \
            -display none \
            -no-reboot &
          QEMU_PID=$!

          cleanup() {
            if kill -0 "$QEMU_PID" 2>/dev/null; then
              kill -TERM "$QEMU_PID" 2>/dev/null || true
              sleep 1
              kill -KILL "$QEMU_PID" 2>/dev/null || true
              wait "$QEMU_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          ready() {
            [ -s serial.log ] || return 1
            grep -q "Rust POSIX Operating System (Framekernel Model)" serial.log || return 1
            grep -q "Kernel Initialization Complete. Kernel running!" serial.log || return 1
            grep -q "Rust POSIX OS - Init Daemon (PID 1) Running" serial.log || return 1
            grep -q "Rust POSIX Shell" serial.log || return 1
          }

          for _ in $(seq 1 90); do
            if ready; then
              echo "[CI] Guest reached interactive shell; stopping QEMU."
              cleanup
              trap - EXIT
              echo "=================== QEMU SERIAL OUTPUT ==================="
              cat serial.log
              echo "=========================================================="
              echo "[CI] QEMU boot smoke test passed"
              exit 0
            fi
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              wait "$QEMU_PID" || true
              echo "=================== QEMU SERIAL OUTPUT ==================="
              cat serial.log || true
              echo "=========================================================="
              echo "FAILED: QEMU exited before the shell banner"
              exit 1
            fi
            sleep 0.5
          done

          echo "=================== QEMU SERIAL OUTPUT ==================="
          cat serial.log || true
          echo "=========================================================="
          echo "FAILED: timed out waiting for shell banner"
          exit 1

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: serial.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, qemu]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download UEFI boot artifacts
        uses: actions/download-artifact@v4
        with:
          name: uefi-boot
          path: release_assets

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/kernel
            release_assets/initramfs.tar
          generate_release_notes: true
          draft: false
          prerelease: false
