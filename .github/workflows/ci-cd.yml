name: CI/CD Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  filter:
    name: Check Paths & Labels
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci:full' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full')
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: Check changed files and ci:full label
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Check if ci:full label is present on PR
          if echo '${{ toJson(github.event.pull_request.labels) }}' | grep -q '"name":\s*"ci:full"'; then
            echo "PR has ci:full label; running full CI matrix."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Check if any non-markdown / non-license files changed
          git fetch origin "${{ github.base_ref }}" --depth=1
          diff_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true)
          code_files=$(echo "$diff_files" | grep -vE '(\.md$|^LICENSE)' || true)
          if [ -n "$code_files" ]; then
            echo "Code files changed; running CI matrix."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only markdown or license files changed; skipping build and qemu."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  rust-quality:
    name: Quality
    needs: filter
    if: needs.filter.outputs.should_run == 'true'
    uses: ./.github/workflows/quality.yml

  build:
    name: Build (${{ matrix.os }})
    needs: [filter, rust-quality]
    if: needs.filter.outputs.should_run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci:full'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Exclude Defender from Cargo dirs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @(
            "$env:USERPROFILE\.cargo",
            "$env:USERPROFILE\.rustup",
            "$env:GITHUB_WORKSPACE\target"
          )
          foreach ($p in $paths) {
            New-Item -ItemType Directory -Force -Path $p | Out-Null
            Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue
          }
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: dbg0
          cache-on-failure: true
      - name: Cache Limine BOOTX64.EFI
        uses: actions/cache@v4
        with:
          path: BOOTX64.EFI
          key: limine-bootx64-v8
      - name: Build kernel and UEFI image
        run: cargo xtask build
      - name: Stage boot artifacts
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          test -d target/iso_root
      - name: Upload UEFI boot artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: uefi-boot
          path: target/iso_root
          if-no-files-found: error

  qemu:
    name: QEMU smoke test
    needs: [filter, build]
    if: needs.filter.outputs.should_run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci:full'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download UEFI boot artifacts
        uses: actions/download-artifact@v4
        with:
          name: uefi-boot
          path: target/iso_root
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Boot and wait for shell banner
        run: |
          set -euo pipefail
          OVMF_PATH=/usr/share/OVMF/OVMF_CODE_4M.fd
          if [ ! -f "$OVMF_PATH" ]; then
            OVMF_PATH=/usr/share/OVMF/OVMF_CODE.fd
          fi
          echo "[CI] Using OVMF: $OVMF_PATH"
          qemu-system-x86_64 \
            -machine q35 \
            -cpu qemu64 \
            -m 512 \
            -display none \
            -serial file:serial.log \
            -no-reboot \
            -drive "if=pflash,format=raw,readonly=on,file=$OVMF_PATH" \
            -drive "file=fat:rw:target/iso_root,format=raw,media=disk" \
            -nic none &
          QEMU_PID=$!
          trap 'kill $QEMU_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 80); do
            if grep -q "Rust POSIX OS - Init Daemon (PID 1) Running" serial.log 2>/dev/null \
              && grep -q "Rust POSIX Shell" serial.log 2>/dev/null; then
              echo "=================== QEMU SERIAL OUTPUT ==================="
              cat serial.log || true
              echo "=========================================================="
              echo "[CI] QEMU boot smoke test passed"
              exit 0
            fi
            if ! kill -0 $QEMU_PID 2>/dev/null; then
              echo "=================== QEMU SERIAL OUTPUT ==================="
              cat serial.log || true
              echo "=========================================================="
              echo "FAILED: QEMU exited before the shell banner"
              exit 1
            fi
            sleep 0.5
          done
          echo "=================== QEMU SERIAL OUTPUT ==================="
          cat serial.log || true
          echo "=========================================================="
          echo "FAILED: QEMU timed out before the shell banner"
          exit 1

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, qemu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download UEFI boot artifacts
        uses: actions/download-artifact@v4
        with:
          name: uefi-boot
          path: target/iso_root
      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: target/iso_root/**
